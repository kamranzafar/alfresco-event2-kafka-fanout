# Defaults for alfresco-event2-kafka-fanout. Override any of these in alfresco-global.properties or with -D JAVA_OPTS.
# Endpoint the event2 producer sends to. The default in-process endpoint is consumed by the fan-out route, which
# publishes to each enabled target below. Set it to ${repo.event2.topic.endpoint} to bypass the module (stock behaviour).
repo.event2.producer.endpoint=direct:alfresco.repo.event2.fanout
# Target: ActiveMQ (the stock alfresco.repo.event2 topic)
repo.event2.route.activemq.enabled=true
repo.event2.route.activemq.endpoint=${repo.event2.topic.endpoint}
# Target: Kafka. Messages are keyed by node id.
# Sends block the single, ordered event2 sender thread until Kafka acknowledges, so keep the timeouts short:
# with failOnError=false a Kafka outage then delays, rather than stalls, the ActiveMQ target.
repo.event2.route.kafka.enabled=false
# Full Camel Kafka endpoint URI. If set, it is used as is and every property below except failOnError is ignored.
# Otherwise the endpoint is built from the topic and the options below; blank options are left out.
repo.event2.route.kafka.endpoint=
repo.event2.route.kafka.topic=alfresco.repo.event2
# Comma-separated host:port list
repo.event2.route.kafka.brokers=localhost:9092
repo.event2.route.kafka.clientId=
repo.event2.route.kafka.requestRequiredAcks=all
repo.event2.route.kafka.enableIdempotence=true
repo.event2.route.kafka.maxBlockMs=5000
repo.event2.route.kafka.requestTimeoutMs=5000
repo.event2.route.kafka.deliveryTimeoutMs=10000
# none, gzip, snappy, lz4 or zstd
repo.event2.route.kafka.compressionCodec=
repo.event2.route.kafka.lingerMs=
# Security. Values with special characters (e.g. saslJaasConfig) are passed on unchanged; no RAW() needed.
# PLAINTEXT, SSL, SASL_PLAINTEXT or SASL_SSL
repo.event2.route.kafka.securityProtocol=
# e.g. PLAIN, SCRAM-SHA-256, SCRAM-SHA-512
repo.event2.route.kafka.saslMechanism=
repo.event2.route.kafka.saslJaasConfig=
repo.event2.route.kafka.sslTruststoreLocation=
repo.event2.route.kafka.sslTruststorePassword=
repo.event2.route.kafka.sslTruststoreType=
repo.event2.route.kafka.sslKeystoreLocation=
repo.event2.route.kafka.sslKeystorePassword=
repo.event2.route.kafka.sslKeystoreType=
repo.event2.route.kafka.sslKeyPassword=
repo.event2.route.kafka.sslEndpointAlgorithm=
# Any other Camel Kafka endpoint options, appended as they are, e.g. maxRequestSize=2097152&retries=5
repo.event2.route.kafka.options=
# If false, Kafka failures are logged and do not affect the ActiveMQ target or the sender
repo.event2.route.kafka.failOnError=false
