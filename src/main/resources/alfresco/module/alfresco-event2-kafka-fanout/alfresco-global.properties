# Defaults for alfresco-event2-kafka-fanout. Override any of these in alfresco-global.properties or with -D JAVA_OPTS.
# Endpoint the event2 producer sends to. The default in-process endpoint is consumed by the fan-out route, which
# publishes to each enabled target below. Set it to ${repo.event2.topic.endpoint} to bypass the module (stock behaviour).
repo.event2.producer.endpoint=direct:alfresco.repo.event2.fanout
# Target: ActiveMQ (the stock alfresco.repo.event2 topic)
repo.event2.route.activemq.enabled=true
repo.event2.route.activemq.endpoint=${repo.event2.topic.endpoint}
# Target: Kafka. Messages are keyed by node id. Add security/producer settings as Camel Kafka endpoint options,
# e.g. &securityProtocol=SASL_SSL&saslMechanism=PLAIN&saslJaasConfig=RAW(...)
# Sends block the single, ordered event2 sender thread until Kafka acknowledges, so keep the timeouts short:
# with failOnError=false a Kafka outage then delays, rather than stalls, the ActiveMQ target.
repo.event2.route.kafka.enabled=false
repo.event2.route.kafka.endpoint=kafka:alfresco.repo.event2?brokers=localhost:9092&requestRequiredAcks=all&enableIdempotence=true&maxBlockMs=5000&requestTimeoutMs=5000&deliveryTimeoutMs=10000
# If false, Kafka failures are logged and do not affect the ActiveMQ target or the sender
repo.event2.route.kafka.failOnError=false
