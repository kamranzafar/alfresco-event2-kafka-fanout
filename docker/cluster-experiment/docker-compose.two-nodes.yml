# EXPERIMENT ONLY: a second Community repository node on the same database and content store.
# Alfresco Community does not support clustering (no cache synchronisation between nodes). See README.md here.
#
# Use with the main stack (paths are relative to docker/, the main compose file's directory):
#   docker compose -f docker/docker-compose.yml -f docker/cluster-experiment/docker-compose.two-nodes.yml up -d alfresco2
# Node 2 in Kafka-only mode (for the "lag" test):
#   NODE2_PROPERTIES=./cluster-experiment/alfresco-global-kafka-only.properties docker compose ... up -d alfresco2
services:
  alfresco2:
    image: event2-kafka-fanout-alfresco
    environment:
      JAVA_TOOL_OPTIONS: "-Dencryption.keystore.type=JCEKS -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding -Dencryption.keyAlgorithm=DESede -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore -Dmetadata-keystore.password=mp6yc0UD9e -Dmetadata-keystore.aliases=metadata -Dmetadata-keystore.metadata.password=oKIWzVdEdA -Dmetadata-keystore.metadata.algorithm=DESede"
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dmessaging.broker.username=admin
        -Dmessaging.broker.password=admin
        -Dindex.subsystem.name=noindex
        -Dlocal.transform.service.enabled=false
        -Dlegacy.transform.service.enabled=false
        -Dcsrf.filter.enabled=false
        -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80
    volumes:
      - ${NODE2_PROPERTIES:-./alfresco-global.properties}:/usr/local/tomcat/shared/classes/alfresco-global.properties:ro
      - alf-data:/usr/local/tomcat/alf_data
    ports:
      - "8081:8080"
    mem_limit: 2500m
