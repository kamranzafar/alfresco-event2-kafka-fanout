# Event2 fan-out settings for the local test stack (mounted into shared/classes).
# Kept here rather than in JAVA_OPTS: catalina.sh evals JAVA_OPTS, which breaks on the '&' and '(' in these URIs.
messaging.broker.url=failover:(nio://activemq:61616)?timeout=3000

repo.event2.route.activemq.enabled=true
repo.event2.route.kafka.enabled=true
repo.event2.route.kafka.brokers=kafka:9092
repo.event2.route.kafka.failOnError=false
