# Local test stack: ACS 26.2 (with the module) + Postgres + ActiveMQ + Kafka. No search or transforms.
#   mvn package && docker compose -f docker/docker-compose.yml up --build
name: event2-kafka-fanout
services:
  alfresco:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: "-Dencryption.keystore.type=JCEKS -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding -Dencryption.keyAlgorithm=DESede -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore -Dmetadata-keystore.password=mp6yc0UD9e -Dmetadata-keystore.aliases=metadata -Dmetadata-keystore.metadata.password=oKIWzVdEdA -Dmetadata-keystore.metadata.algorithm=DESede"
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dmessaging.broker.username=admin
        -Dmessaging.broker.password=admin
        -Dindex.subsystem.name=noindex
        -Dlocal.transform.service.enabled=false
        -Dlegacy.transform.service.enabled=false
        -Dcsrf.filter.enabled=false
        -XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80
    volumes:
      - ./alfresco-global.properties:/usr/local/tomcat/shared/classes/alfresco-global.properties:ro
      # content store must survive image rebuilds, or it no longer matches the database
      - alf-data:/usr/local/tomcat/alf_data
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_started
      activemq:
        condition: service_started
      kafka-init:
        # the event2 topic must exist with its partitions before Alfresco publishes, or it is auto-created with 1
        condition: service_completed_successfully
  postgres:
    image: postgres:16.6
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: alfresco
      POSTGRES_PASSWORD: alfresco
      POSTGRES_DB: alfresco
  activemq:
    image: alfresco/alfresco-activemq:6.2-jre17-rockylinux8
    ports:
      - "8161:8161"
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  kafka-init:
    # One-shot: creates the event2 topic with several partitions so per-node ordering is tested across partitions.
    # Change the count with EVENT2_TOPIC_PARTITIONS (only applies when the topic is first created).
    image: apache/kafka:3.9.1
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 2; done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic alfresco.repo.event2 --partitions ${EVENT2_TOPIC_PARTITIONS:-6} --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic alfresco.repo.event2

volumes:
  alf-data:
  postgres-data:
